<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12"/>
      <stop offset="50%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(59, 130, 246, 0.35)" stroke-width="4"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2"/>

  <!-- Glowing Geometric C Monogram & Code Brackets -->
  <g filter="url(#glow)">
    <!-- Outer Arc / Angular C-Shape -->
    <path d="M 350 148 
             L 220 148 
             C 160 148, 120 190, 120 256 
             C 120 322, 160 364, 220 364 
             L 350 364" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Digital Slash / Diamond Core -->
    <path d="M 276 210 L 236 302" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Signal Active Node (Electric Dot) -->
    <circle cx="360" cy="256" r="24" fill="#60a5fa"/>
    <circle cx="360" cy="256" r="12" fill="#ffffff"/>
  </g>
</svg>
